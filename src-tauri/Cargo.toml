[package]
name = "pi-desktop"
version = "1.0.0"
description = "Pi Desktop - A minimal coding agent desktop app"
authors = ["Pi Desktop contributors"]
edition = "2021"

[lib]
name = "pi_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-notification = "=2.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "8"
portable-pty = "0.9"
flate2 = "1"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
