name: Signed Release Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed Pi GUI release tag to verify"
        required: true
        default: "v0.1.0"
        type: string
      previous_tag:
        description: "Optional previous signed tag for a Windows upgrade test"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke-macos:
    name: Verify macOS artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.dmg" \
            --pattern "*.app.tar.gz" \
            --dir smoke-assets

      - name: Verify bundle, signature, and archive
        run: |
          set -euo pipefail
          DMG="$(find smoke-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          APP_TAR="$(find smoke-assets -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -s "$DMG"
          test -s "$APP_TAR"

          MOUNT_DIR="$(mktemp -d /tmp/pi-gui-smoke.XXXXXX)"
          trap 'hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null || true; rm -rf "$MOUNT_DIR"' EXIT
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$MOUNT_DIR"
          APP_PATH="$MOUNT_DIR/Pi GUI.app"
          test -f "$APP_PATH/Contents/MacOS/pi-gui"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          hdiutil detach "$MOUNT_DIR" -quiet

          mkdir smoke-macos-unpacked
          tar -xzf "$APP_TAR" -C smoke-macos-unpacked
          ARCHIVE_APP="$(find smoke-macos-unpacked -maxdepth 2 -name 'Pi GUI.app' -type d -print -quit)"
          test -f "$ARCHIVE_APP/Contents/MacOS/pi-gui"
          codesign --verify --deep --strict --verbose=2 "$ARCHIVE_APP"

  smoke-windows:
    name: Install, launch, update, and uninstall on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PI_GUI_CLEAN_MACHINE: github-hosted-windows

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download current release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path smoke-assets -Force | Out-Null
          gh release download "${{ inputs.tag }}" `
            --repo "${{ github.repository }}" `
            --pattern "*setup.exe" `
            --pattern "*.msi" `
            --dir smoke-assets

      - name: Download previous installer
        if: inputs.previous_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path previous-assets -Force | Out-Null
          gh release download "${{ inputs.previous_tag }}" `
            --repo "${{ github.repository }}" `
            --pattern "*setup.exe" `
            --dir previous-assets

      - name: Require valid Windows signatures
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem smoke-assets -File)
          if (($assets | Where-Object Name -Like "*setup.exe").Count -ne 1) { throw "Expected one NSIS installer" }
          if (($assets | Where-Object Extension -EQ ".msi").Count -ne 1) { throw "Expected one MSI installer" }
          foreach ($asset in $assets) {
            $signature = Get-AuthenticodeSignature $asset.FullName
            if ($signature.Status -ne "Valid") { throw "$($asset.Name) signature is $($signature.Status), expected Valid" }
          }

      - name: Verify MSI contents
        shell: pwsh
        run: |
          $msi = (Get-ChildItem smoke-assets -Filter "*.msi" | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP "pi-gui-msi-extract"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $arguments = "/a `"$msi`" /qn TARGETDIR=`"$target`""
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed with $($process.ExitCode)" }
          $executable = Get-ChildItem $target -Recurse -Filter "pi-gui.exe" | Select-Object -First 1
          if (-not $executable) { throw "MSI did not contain pi-gui.exe" }
          $signature = Get-AuthenticodeSignature $executable.FullName
          if ($signature.Status -ne "Valid") { throw "MSI payload signature is $($signature.Status), expected Valid" }

      - name: Verify NSIS lifecycle
        shell: pwsh
        run: |
          $arguments = @{
            InstallerPath = (Get-ChildItem smoke-assets -Filter "*setup.exe" | Select-Object -First 1).FullName
            ExpectedVersion = "${{ inputs.tag }}".TrimStart("v")
            RequireSignature = $true
          }
          if (Test-Path previous-assets) {
            $arguments.PreviousInstallerPath = (Get-ChildItem previous-assets -Filter "*setup.exe" | Select-Object -First 1).FullName
          }
          ./scripts/windows-installer-smoke.ps1 @arguments

  smoke-linux:
    name: Verify Linux artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.AppImage" \
            --pattern "*.deb" \
            --dir smoke-assets

      - name: Verify DEB contents
        run: |
          set -euo pipefail
          DEB="$(find smoke-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee deb-contents.txt
          grep -q "usr/share/metainfo/com.pi.gui.metainfo.xml" deb-contents.txt
          grep -q "usr/bin/pi-gui" deb-contents.txt

      - name: Verify AppImage contents
        run: |
          set -euo pipefail
          APPIMAGE="$(find smoke-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -s "$APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/AppRun
          test -f squashfs-root/usr/share/metainfo/com.pi.gui.metainfo.xml
          test -f squashfs-root/usr/bin/pi-gui
