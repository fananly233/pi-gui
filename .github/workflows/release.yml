name: Signed Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (example: v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and verify tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          EXACT_TAG="$(git describe --tags --exact-match HEAD)"
          if [[ "$EXACT_TAG" != "$TAG" ]]; then
            echo "Checked-out commit is tagged $EXACT_TAG, expected $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  bundle-and-verify:
    name: Build and verify (${{ matrix.os_name }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles app,dmg"
            os_name: "macOS"
            artifact_name: "pi-gui-release-macos"
          - platform: windows-latest
            args: "--bundles nsis,msi --config src-tauri/tauri.release.windows.conf.json"
            os_name: "Windows"
            artifact_name: "pi-gui-release-windows"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            os_name: "Linux"
            artifact_name: "pi-gui-release-linux"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Require Windows signing configuration
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_EXPECTED_SIGNER_SUBJECT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WINDOWS_SIGNING_MODE -ne "pfx") {
            throw "WINDOWS_SIGNING_MODE must be 'pfx'. Use a provider-specific signCommand for modern cloud/HSM certificates."
          }
          foreach ($name in @(
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_EXPECTED_SIGNER_SUBJECT",
            "WINDOWS_TIMESTAMP_URL"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required GitHub Actions secret or variable: $name"
            }
          }

          $timestamp = [Uri]$env:WINDOWS_TIMESTAMP_URL
          if (-not $timestamp.IsAbsoluteUri -or $timestamp.Scheme -notin @("http", "https")) {
            throw "WINDOWS_TIMESTAMP_URL must be an absolute HTTP(S) URL from the certificate issuer."
          }

      - name: Validate source and release metadata
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          npm run check
          npm test
          npm run check:release
          npm run build:frontend
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm audit

      - name: Import Windows PFX and create runner-only Tauri config
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_EXPECTED_SIGNER_SUBJECT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificateDirectory = Join-Path $env:RUNNER_TEMP "pi-gui-signing"
          $encodedPath = Join-Path $certificateDirectory "certificate.txt"
          $pfxPath = Join-Path $certificateDirectory "certificate.pfx"
          $imported = @()
          New-Item -ItemType Directory -Path $certificateDirectory -Force | Out-Null
          try {
            [IO.File]::WriteAllText($encodedPath, $env:WINDOWS_CERTIFICATE, [Text.UTF8Encoding]::new($false))
            certutil -decode $encodedPath $pfxPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Unable to decode WINDOWS_CERTIFICATE." }

            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $signer = $imported | Where-Object {
              $_.HasPrivateKey -and
              $_.NotBefore -le (Get-Date) -and
              $_.NotAfter -gt (Get-Date) -and
              $_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid
            } | Select-Object -First 1
            if (-not $signer) { throw "The PFX does not contain a currently valid code-signing certificate with a private key." }
            if ($signer.Subject -ne $env:WINDOWS_EXPECTED_SIGNER_SUBJECT) {
              throw "Imported signer subject does not match WINDOWS_EXPECTED_SIGNER_SUBJECT."
            }

            $importedThumbprints = ($imported | ForEach-Object Thumbprint) -join ","
            "PI_GUI_WINDOWS_IMPORTED_THUMBPRINTS=$importedThumbprints" >> $env:GITHUB_ENV
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $signer.Thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            }
            $config | ConvertTo-Json -Depth 4 | Set-Content "src-tauri/tauri.release.windows.conf.json" -Encoding utf8NoBOM
          } catch {
            foreach ($certificate in $imported) {
              Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            throw
          } finally {
            Remove-Item $certificateDirectory -Recurse -Force -ErrorAction SilentlyContinue
            $password = $null
          }

      - name: Build signed Windows bundles
        if: matrix.platform == 'windows-latest'
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Build signed macOS bundles
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Build Linux bundles
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Verify and stage Windows signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_EXPECTED_SIGNER_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          $application = Get-Item "src-tauri/target/release/pi-gui.exe"
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe")
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi")
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one MSI."
          }
          $installers = $nsis + $msi

          foreach ($file in @($application) + $installers) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($file.Name) signature is $($signature.Status), expected Valid."
            }
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_EXPECTED_SIGNER_SUBJECT) {
              throw "$($file.Name) signer does not match WINDOWS_EXPECTED_SIGNER_SUBJECT."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$($file.Name) has no trusted timestamp."
            }
          }

          $staging = Join-Path $env:RUNNER_TEMP "pi-gui-release"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $installers | Copy-Item -Destination $staging

      - name: Verify and stage macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)"
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -d "$APP_PATH"
          test -s "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

          STAGING="$RUNNER_TEMP/pi-gui-release"
          mkdir -p "$STAGING"
          cp "$DMG_PATH" "$STAGING/"
          tar -czf "$STAGING/Pi.GUI.app.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify and stage Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -s "$APPIMAGE"
          test -s "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | tee deb-contents.txt
          grep -q "usr/share/metainfo/com.pi.gui.metainfo.xml" deb-contents.txt
          grep -q "usr/bin/pi-gui" deb-contents.txt

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/AppRun
          test -f squashfs-root/usr/share/metainfo/com.pi.gui.metainfo.xml
          test -f squashfs-root/usr/bin/pi-gui

          STAGING="$RUNNER_TEMP/pi-gui-release"
          mkdir -p "$STAGING"
          cp "$APPIMAGE" "$DEB" "$STAGING/"

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/pi-gui-release/*

      - name: Remove imported Windows certificate
        if: matrix.platform == 'windows-latest' && always()
        shell: pwsh
        run: |
          foreach ($thumbprint in ($env:PI_GUI_WINDOWS_IMPORTED_THUMBPRINTS -split ",")) {
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }
          Remove-Item "src-tauri/tauri.release.windows.conf.json" -Force -ErrorAction SilentlyContinue

  create-draft:
    name: Create verified draft release
    needs: [validate-release, bundle-and-verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - name: Download verified assets
        uses: actions/download-artifact@v5
        with:
          pattern: pi-gui-release-*
          merge-multiple: true
          path: release-assets

      - name: Require complete artifact set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.dmg' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.app.tar.gz' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*setup.exe' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.msi' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 1

      - name: Create or update draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "$IS_DRAFT" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pi GUI $RELEASE_TAG" \
              --notes-file .github/RELEASE_TEMPLATE.md
          elif [[ "$IS_DRAFT" != "true" ]]; then
            echo "Release $RELEASE_TAG already exists and is not a draft." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
