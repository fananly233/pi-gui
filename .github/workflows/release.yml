name: Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (example: v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  bundle-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles app,dmg"
            os_name: "macOS"
          - platform: windows-latest
            args: "--bundles nsis,msi"
            os_name: "Windows"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            os_name: "Linux"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag
        id: release_tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Unable to resolve release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate source and release metadata
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          npm run check
          npm test
          npm run check:release
          npm run build:frontend
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm audit

      - name: Build and upload draft (${{ matrix.os_name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: "Pi GUI ${{ steps.release_tag.outputs.tag }}"
          releaseBody: |
            Draft build of Pi GUI, a derivative of Gustav Pi Desktop with selected UI material adapted from DLYZZT Pi Desktop.

            Do not publish this draft until signing and clean-machine release smoke checks are complete.
          releaseDraft: true
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
