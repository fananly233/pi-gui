name: Source-only Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source tag to validate (example: v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate source policy
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve and verify tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          EXACT_TAG="$(git describe --tags --exact-match HEAD)"
          if [[ "$EXACT_TAG" != "$TAG" ]]; then
            echo "Checked-out commit is tagged $EXACT_TAG, expected $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate source policy and repository
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          npm run check:publish
          npm run check:release
          npm run check
          npm test
          npm run build:frontend
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm audit

  create-draft:
    name: Create source-only draft
    needs: validate-source
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-source.outputs.tag }}

      - name: Create or update source-only draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "$IS_DRAFT" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pi GUI $RELEASE_TAG (source only)" \
              --notes-file .github/RELEASE_TEMPLATE.md
          elif [[ "$IS_DRAFT" != "true" ]]; then
            echo "Release $RELEASE_TAG already exists and is not a draft." >&2
            exit 1
          else
            ASSET_COUNT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            if [[ "$ASSET_COUNT" != "0" ]]; then
              echo "Source-only draft $RELEASE_TAG has $ASSET_COUNT attached asset(s)." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Pi GUI $RELEASE_TAG (source only)" \
              --notes-file .github/RELEASE_TEMPLATE.md
          fi
